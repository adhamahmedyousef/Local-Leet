name: Refresh ranking data
on:
  schedule:
    - cron: '17 5,11,17 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Deploy the verified initial release instead of collecting again
        type: boolean
        default: false
      verify_source:
        description: Check source access only; do not collect or publish
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ranking-data
  cancel-in-progress: false
jobs:
  keepalive:
    if: github.repository == 'adhamahmedyousef/Local-Leet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Renew this workflow without repository commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/adhamahmedyousef/Local-Leet/actions/workflows/refresh.yml/enable',
              method='PUT',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError('Workflow renewal failed')
          print('Refresh workflow renewed; no data collected or commits created.')
          PY
  collect:
    if: github.repository == 'adhamahmedyousef/Local-Leet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      publish: ${{ steps.data.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Collect daily with backup triggers
        id: data
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          BOOTSTRAP: ${{ inputs.bootstrap && 'true' || 'false' }}
          VERIFY_SOURCE: ${{ inputs.verify_source && 'true' || 'false' }}
        run: |
          args=()
          if [ "$SCHEDULED" = true ]; then args+=(--scheduled); fi
          if [ "$BOOTSTRAP" = true ]; then args+=(--bootstrap); fi
          if [ "$VERIFY_SOURCE" = true ]; then args+=(--probe); fi
          python scripts/refresh-data.py "${args[@]}"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.data.outputs.publish == 'true'
        with:
          path: dist/site
          retention-days: 1
  deploy:
    needs: collect
    if: github.repository == 'adhamahmedyousef/Local-Leet' && github.ref == 'refs/heads/main' && needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified data
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
